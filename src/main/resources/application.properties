# --- App ---
spring.main.web-application-type=none
spring.main.banner-mode=off

# --- Datasource (SQLite) ---
spring.datasource.url=jdbc:sqlite:autocore.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# Slå på foreign keys för varje anslutning (SQLite hade dem avstängda som standard)
spring.datasource.hikari.data-source-properties.foreign_keys=true

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Befintliga autocore.db (skapade av gamla schema.sql) markeras som V1 i stället för att krascha
spring.flyway.baseline-on-migrate=true
