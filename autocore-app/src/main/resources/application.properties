# --- App ---
spring.main.web-application-type=none
spring.main.banner-mode=off

# --- Datasource (SQLite) ---
spring.datasource.url=jdbc:sqlite:autocore.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# Turn on foreign keys for every connection (SQLite has them disabled by default)
spring.datasource.hikari.data-source-properties.foreign_keys=true

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing autocore.db files (created by the old schema.sql) are marked as V1 instead of crashing
spring.flyway.baseline-on-migrate=true
