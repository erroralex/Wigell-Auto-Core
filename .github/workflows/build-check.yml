name: Compile check
on:
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 with JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '8'
          java-package: 'jdk+fx'

      - name: Compile all sources
        run: |
          mkdir -p out
          find src -name "*.java" > sources.txt
          javac -d out @sources.txt