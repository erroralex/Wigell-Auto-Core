name: Compile check
on:
  pull_request:
    branches: [ main, dev ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '8'
          java-package: 'jdk+fx'
          cache: 'maven'

      - name: Build and test
        run: ./mvnw -B clean verify